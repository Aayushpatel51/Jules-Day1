<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitFlow - 30 Day Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .habit-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        @media (min-width: 768px) {
            .habit-grid {
                grid-template-columns: repeat(10, 1fr);
            }
        }
        .habit-cell {
            aspect-ratio: 1;
            transition: all 0.2s;
        }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-[#FDFCFB] min-h-screen font-sans text-slate-900 p-6 md:p-12">
    <div class="max-w-4xl mx-auto space-y-10">
        <!-- Header -->
        <header class="flex justify-between items-center">
            <div>
                <h1 class="text-4xl font-bold tracking-tight">Habit<span class="text-indigo-600">Flow</span></h1>
                <p class="text-slate-500">Consistency is the key to excellence.</p>
            </div>
            <div class="flex items-center gap-4">
                <button id="addHabitBtn" class="flex items-center gap-2 px-6 py-3 bg-slate-900 text-white rounded-2xl font-bold hover:bg-slate-800 transition-all shadow-lg shadow-slate-200">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                    <span>New Habit</span>
                </button>
            </div>
        </header>

        <!-- Stats Overview -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="p-6 bg-white rounded-3xl border border-slate-100 shadow-sm">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-1">Active Habits</p>
                <h2 id="activeCount" class="text-3xl font-bold">0</h2>
            </div>
            <div class="p-6 bg-indigo-50 rounded-3xl border border-indigo-100 shadow-sm">
                <p class="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-1">Best Streak</p>
                <h2 id="bestStreak" class="text-3xl font-bold text-indigo-600">0 Days</h2>
            </div>
            <div class="p-6 bg-emerald-50 rounded-3xl border border-emerald-100 shadow-sm">
                <p class="text-xs font-bold text-emerald-400 uppercase tracking-widest mb-1">Total Completion</p>
                <h2 id="totalCompletion" class="text-3xl font-bold text-emerald-600">0%</h2>
            </div>
        </div>

        <!-- Habits List -->
        <div id="habitsList" class="space-y-6">
            <!-- Habit Item -->
        </div>
    </div>

    <!-- Modal -->
    <div id="habitModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex items-center justify-center p-6 z-50">
        <div class="bg-white rounded-[2.5rem] p-10 w-full max-w-md shadow-2xl animate-in zoom-in-95 duration-200">
            <h2 class="text-2xl font-bold mb-6">Create New Habit</h2>
            <form id="habitForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-slate-400 uppercase mb-2">Habit Name</label>
                    <input type="text" id="habitName" required placeholder="e.g. Read 20 pages"
                        class="w-full px-6 py-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-400 uppercase mb-2">Icon</label>
                        <select id="habitIcon" class="w-full px-6 py-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all">
                            <option value="book">Book</option>
                            <option value="dumbbell">Fitness</option>
                            <option value="droplets">Water</option>
                            <option value="moon">Sleep</option>
                            <option value="coffee">Morning</option>
                            <option value="code">Coding</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-400 uppercase mb-2">Duration</label>
                        <select id="habitDuration" class="w-full px-6 py-4 bg-slate-50 rounded-2xl border-2 border-transparent focus:border-indigo-500 focus:bg-white outline-none transition-all">
                            <option value="7">7 Days</option>
                            <option value="21">21 Days</option>
                            <option value="30" selected>30 Days</option>
                            <option value="60">60 Days</option>
                            <option value="90">90 Days</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="button" id="closeModal" class="flex-1 py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition-all">Cancel</button>
                    <button type="submit" class="flex-1 py-4 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 transition-all shadow-xl shadow-indigo-200">Start Habit</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let habits = JSON.parse(localStorage.getItem('habits')) || [];
        const habitsList = document.getElementById('habitsList');
        const modal = document.getElementById('habitModal');
        const form = document.getElementById('habitForm');

        function renderHabits() {
            habitsList.innerHTML = '';
            if (habits.length === 0) {
                habitsList.innerHTML = `
                    <div class="text-center py-20 bg-slate-50 rounded-[2.5rem] border-2 border-dashed border-slate-200">
                        <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="sparkles" class="text-slate-400"></i>
                        </div>
                        <h3 class="text-xl font-bold text-slate-600">No habits yet</h3>
                        <p class="text-slate-400">Add a new habit to start your journey.</p>
                    </div>
                `;
                lucide.createIcons();
                updateStats();
                return;
            }

            habits.forEach((habit, index) => {
                const habitEl = document.createElement('div');
                habitEl.className = 'p-8 bg-white rounded-[2.5rem] border border-slate-100 shadow-sm flex flex-col md:flex-row gap-8 items-start md:items-center';

                const duration = parseInt(habit.duration) || 30;
                const startDate = habit.startDate ? new Date(habit.startDate) : new Date();

                const allDays = [];
                for (let i = 0; i < duration; i++) {
                    const d = new Date(startDate);
                    d.setDate(d.getDate() + i);
                    const dateStr = d.toISOString().split('T')[0];
                    allDays.push({
                        date: dateStr,
                        completed: habit.history.includes(dateStr),
                        isFuture: d > new Date()
                    });
                }

                habitEl.innerHTML = `
                    <div class="flex items-center gap-6 flex-grow mb-4 md:mb-0">
                        <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center flex-shrink-0">
                            <i data-lucide="${habit.icon}" class="w-7 h-7"></i>
                        </div>
                        <div>
                            <h3 class="text-xl font-bold">${habit.name}</h3>
                            <p class="text-slate-400 text-sm font-semibold">${habit.history.length} / ${duration} days achieved</p>
                            <div class="w-full bg-slate-100 h-1.5 rounded-full mt-2 overflow-hidden">
                                <div class="bg-indigo-600 h-full rounded-full transition-all duration-500" style="width: ${(habit.history.length / duration) * 100}%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="flex-grow max-w-full overflow-hidden">
                        <div class="habit-grid">
                            ${allDays.map((day, dIdx) => `
                                <button onclick="toggleDay(${index}, '${day.date}')"
                                    ${day.isFuture ? 'disabled' : ''}
                                    title="${day.date}"
                                    class="habit-cell w-8 h-8 md:w-7 md:h-7 rounded-lg border-2 transition-all flex items-center justify-center
                                    ${day.completed ? 'bg-indigo-600 border-indigo-600 text-white shadow-md shadow-indigo-200' :
                                      day.isFuture ? 'bg-slate-50 border-slate-50 cursor-not-allowed' : 'bg-white border-slate-100 text-transparent hover:border-indigo-200'}">
                                    <i data-lucide="check" class="w-3 h-3 ${day.completed ? '' : 'hidden'}"></i>
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <button onclick="deleteHabit(${index})" class="p-4 text-slate-300 hover:text-red-500 transition-colors ml-auto">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                `;
                habitsList.appendChild(habitEl);
            });
            lucide.createIcons();
            updateStats();
        }

        function toggleDay(habitIndex, dateStr) {
            const habit = habits[habitIndex];
            const historyIndex = habit.history.indexOf(dateStr);
            if (historyIndex === -1) {
                habit.history.push(dateStr);
            } else {
                habit.history.splice(historyIndex, 1);
            }
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('habits', JSON.stringify(habits));
            renderHabits();
        }

        function deleteHabit(index) {
            habits.splice(index, 1);
            saveAndRender();
        }

        function calculateStreak(history) {
            if (!history || history.length === 0) return 0;
            const sortedDates = [...history].sort((a, b) => new Date(b) - new Date(a));

            let streak = 0;
            let currentDate = new Date();
            currentDate.setHours(0, 0, 0, 0);

            const mostRecent = new Date(sortedDates[0]);
            mostRecent.setHours(0, 0, 0, 0);

            const diffDays = Math.floor((currentDate - mostRecent) / (1000 * 60 * 60 * 24));
            if (diffDays > 1) return 0;

            let expectedDate = mostRecent;
            for (const dateStr of sortedDates) {
                const date = new Date(dateStr);
                date.setHours(0, 0, 0, 0);

                if (date.getTime() === expectedDate.getTime()) {
                    streak++;
                    expectedDate.setDate(expectedDate.getDate() - 1);
                } else {
                    break;
                }
            }
            return streak;
        }

        function updateStats() {
            document.getElementById('activeCount').textContent = habits.length;

            const streaks = habits.map(h => calculateStreak(h.history));
            const best = habits.length > 0 ? Math.max(...streaks) : 0;
            document.getElementById('bestStreak').textContent = `${best} Days`;

            const totalChecks = habits.reduce((sum, h) => sum + h.history.length, 0);
            const totalGoal = habits.reduce((sum, h) => sum + (parseInt(h.duration) || 30), 0);
            const completion = totalGoal > 0 ? Math.round((totalChecks / totalGoal) * 100) : 0;

            const completionEl = document.getElementById('totalCompletion');
            // Animate number count
            const startVal = parseInt(completionEl.textContent) || 0;
            animateValue(completionEl, startVal, completion, 1000);
        }

        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = Math.floor(progress * (end - start) + start) + '%';
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        // Modal Logic
        document.getElementById('addHabitBtn').onclick = () => modal.classList.remove('hidden');
        document.getElementById('closeModal').onclick = () => modal.classList.add('hidden');

        form.onsubmit = (e) => {
            e.preventDefault();
            const newHabit = {
                name: document.getElementById('habitName').value,
                icon: document.getElementById('habitIcon').value,
                duration: document.getElementById('habitDuration').value,
                startDate: new Date().toISOString().split('T')[0],
                history: []
            };
            habits.unshift(newHabit);
            modal.classList.add('hidden');
            form.reset();
            saveAndRender();
        };

        renderHabits();
    </script>
</body>
</html>
