<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpenseFlow - 30 Day Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #1e293b; }
    </style>
</head>
<body class="bg-[#F8FAFC] dark:bg-[#020617] min-h-screen font-sans transition-colors duration-300">
    <div class="max-w-6xl mx-auto px-6 py-8">
        <!-- Header -->
        <header class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-bold text-slate-900 dark:text-white">Expense<span class="text-indigo-600">Flow</span></h1>
                <p class="text-slate-500 dark:text-slate-400">Smart tracking for your finances</p>
            </div>
            <button id="themeToggle" class="p-3 rounded-2xl bg-white dark:bg-slate-900 shadow-sm border border-slate-200 dark:border-slate-800 hover:scale-105 transition-all">
                <i data-lucide="sun" class="w-5 h-5 text-amber-500 hidden dark:block"></i>
                <i data-lucide="moon" class="w-5 h-5 text-indigo-600 block dark:hidden"></i>
            </button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- Left Column: Add & Stats -->
            <div class="lg:col-span-4 space-y-6">
                <!-- Balance Card -->
                <div class="p-8 rounded-[2rem] bg-indigo-600 text-white shadow-xl shadow-indigo-500/20 relative overflow-hidden">
                    <div class="relative z-10">
                        <p class="text-indigo-100 font-medium mb-1">Total Balance</p>
                        <h2 id="totalBalance" class="text-4xl font-bold">$0.00</h2>
                    </div>
                    <i data-lucide="wallet" class="absolute -right-4 -bottom-4 w-32 h-32 text-indigo-500/20 rotate-12"></i>
                </div>

                <!-- Form -->
                <div class="p-6 rounded-[2rem] glass">
                    <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-4">Add Transaction</h3>
                    <form id="expenseForm" class="space-y-4">
                        <div>
                            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Description</label>
                            <input type="text" id="desc" required placeholder="e.g. Grocery Shopping"
                                class="w-full px-4 py-3 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-900 dark:text-white">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Amount</label>
                                <input type="number" id="amount" required step="0.01" placeholder="0.00"
                                    class="w-full px-4 py-3 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-900 dark:text-white">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Category</label>
                                <select id="category" class="w-full px-4 py-3 rounded-xl bg-white dark:bg-slate-950 border border-slate-200 dark:border-slate-800 outline-none focus:ring-2 focus:ring-indigo-500 transition-all text-slate-900 dark:text-white">
                                    <option value="Food">Food</option>
                                    <option value="Rent">Rent</option>
                                    <option value="Transport">Transport</option>
                                    <option value="Entertainment">Fun</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-500/30">
                            Add Transaction
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Column: List & Chart -->
            <div class="lg:col-span-8 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- History -->
                    <div class="p-6 rounded-[2rem] glass flex flex-col h-[500px]">
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-4">Recent History</h3>
                        <div id="transactionList" class="space-y-3 overflow-y-auto flex-grow pr-2">
                            <!-- Items here -->
                            <div class="text-center py-20 text-slate-400 italic">No transactions yet.</div>
                        </div>
                    </div>

                    <!-- Chart -->
                    <div class="p-6 rounded-[2rem] glass flex flex-col h-[500px]">
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-4">Category Breakdown</h3>
                        <div class="flex-grow flex items-center justify-center">
                            <canvas id="expenseChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
            updateChartTheme();
        });

        if (localStorage.getItem('theme') === 'dark') {
            html.classList.add('dark');
        }

        // Logic
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
        const form = document.getElementById('expenseForm');
        const transactionList = document.getElementById('transactionList');
        const totalBalance = document.getElementById('totalBalance');
        let chart;

        function updateUI() {
            transactionList.innerHTML = '';
            let balance = 0;
            const categories = {};

            if (transactions.length === 0) {
                transactionList.innerHTML = '<div class="text-center py-20 text-slate-400 italic">No transactions yet.</div>';
            } else {
                transactions.forEach((t, index) => {
                    balance += t.amount;
                    categories[t.category] = (categories[t.category] || 0) + t.amount;

                    const item = document.createElement('div');
                    item.className = 'flex items-center justify-between p-4 bg-white dark:bg-slate-900/50 rounded-2xl border border-slate-100 dark:border-slate-800 transition-all hover:scale-[1.02]';
                    item.innerHTML = `
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-indigo-100 dark:bg-indigo-900/30 flex items-center justify-center text-indigo-600">
                                <i data-lucide="${getCategoryIcon(t.category)}" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-slate-900 dark:text-white leading-tight">${t.description}</h4>
                                <span class="text-xs text-slate-500 font-medium">${t.category}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <span class="font-bold text-slate-900 dark:text-white">$${t.amount.toFixed(2)}</span>
                            <button onclick="deleteTransaction(${index})" class="p-2 text-slate-300 hover:text-red-500 transition-colors">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                    transactionList.appendChild(item);
                });
                lucide.createIcons();
            }

            totalBalance.textContent = `$${balance.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            updateChart(categories);
            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        function getCategoryIcon(cat) {
            const icons = {
                'Food': 'utensils',
                'Rent': 'home',
                'Transport': 'car',
                'Entertainment': 'tv',
                'Other': 'box'
            };
            return icons[cat] || 'box';
        }

        function deleteTransaction(index) {
            transactions.splice(index, 1);
            updateUI();
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const newTransaction = {
                description: document.getElementById('desc').value,
                amount: parseFloat(document.getElementById('amount').value),
                category: document.getElementById('category').value,
                id: Date.now()
            };
            transactions.unshift(newTransaction);
            updateUI();
            form.reset();
        });

        function updateChart(categories) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const data = {
                labels: Object.keys(categories),
                datasets: [{
                    data: Object.values(categories),
                    backgroundColor: [
                        '#6366f1', '#ec4899', '#f59e0b', '#10b981', '#64748b'
                    ],
                    borderWidth: 0
                }]
            };

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'doughnut',
                data: data,
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: html.classList.contains('dark') ? '#94a3b8' : '#64748b',
                                font: {
                                    family: 'Plus Jakarta Sans',
                                    weight: '600'
                                }
                            }
                        }
                    },
                    cutout: '70%'
                }
            });
        }

        function updateChartTheme() {
            if (chart) {
                chart.options.plugins.legend.labels.color = html.classList.contains('dark') ? '#94a3b8' : '#64748b';
                chart.update();
            }
        }

        // Initial Load
        updateUI();
    </script>
</body>
</html>
