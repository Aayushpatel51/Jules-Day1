<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder - 30 Day Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .recipe-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .recipe-card:hover {
            transform: translateY(-8px);
        }
        .modal-enter {
            animation: modal-fade-in 0.3s ease-out forwards;
        }
        @keyframes modal-fade-in {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen font-sans transition-colors duration-300">
    <!-- Navigation -->
    <nav class="sticky top-0 z-50 glass border-b border-white/20 dark:border-white/10 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="p-2 bg-orange-500 rounded-xl">
                    <i data-lucide="utensils" class="w-6 h-6 text-white"></i>
                </div>
                <span class="text-2xl font-serif font-bold text-slate-900 dark:text-white">Taste<span class="text-orange-500">Hub</span></span>
            </div>
            <button id="themeToggle" class="p-3 rounded-2xl bg-white dark:bg-slate-900 shadow-lg hover:scale-110 transition-all duration-300">
                <i data-lucide="sun" class="w-5 h-5 text-amber-500 hidden dark:block"></i>
                <i data-lucide="moon" class="w-5 h-5 text-indigo-600 block dark:hidden"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-12 space-y-12">
        <!-- Hero Section -->
        <div class="text-center space-y-6 max-w-2xl mx-auto">
            <h1 class="text-5xl md:text-6xl font-serif font-bold text-slate-900 dark:text-white leading-tight">Find the perfect <span class="text-orange-500 italic">recipe</span> for any occasion</h1>
            <p class="text-lg text-slate-600 dark:text-slate-400">Search thousands of recipes, ingredients, and nutritional information instantly.</p>

            <div class="relative group">
                <input type="text" id="searchInput" placeholder="Search for recipes (e.g., Pasta, Vegan, Breakfast)..."
                    class="w-full px-8 py-5 rounded-[2rem] bg-white dark:bg-slate-900 border-2 border-transparent focus:border-orange-500 outline-none shadow-2xl transition-all text-slate-900 dark:text-white pr-16">
                <button id="searchBtn" class="absolute right-3 top-3 bottom-3 px-6 rounded-2xl bg-orange-500 text-white hover:bg-orange-600 transition-colors shadow-lg shadow-orange-500/30">
                    <i data-lucide="search" class="w-6 h-6"></i>
                </button>
            </div>
        </div>

        <!-- Results Grid -->
        <div id="recipeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Loading State -->
            <div id="loading" class="hidden col-span-full text-center py-20">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-orange-500 border-t-transparent"></div>
                <p class="mt-4 text-slate-500 font-medium">Fetching culinary delights...</p>
            </div>

            <!-- Default Content -->
            <div id="initialState" class="col-span-full text-center py-20 space-y-4">
                <i data-lucide="chef-hat" class="w-16 h-16 text-slate-300 mx-auto"></i>
                <p class="text-slate-500 text-xl font-medium">Type something to start your food journey</p>
            </div>
        </div>
    </main>

    <!-- Ingredients Modal -->
    <div id="ingredientsModal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-950/40 backdrop-blur-sm" id="modalOverlay"></div>
        <div class="relative bg-white dark:bg-slate-900 w-full max-w-lg rounded-[2.5rem] p-10 shadow-2xl modal-enter">
            <button id="closeModal" class="absolute top-6 right-6 p-2 text-slate-400 hover:text-orange-500 transition-colors">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
            <div class="space-y-6">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-orange-100 dark:bg-orange-500/20 rounded-2xl">
                        <i data-lucide="shopping-basket" class="w-6 h-6 text-orange-600 dark:text-orange-400"></i>
                    </div>
                    <h2 id="modalTitle" class="text-3xl font-serif font-bold text-slate-900 dark:text-white">Ingredients</h2>
                </div>
                <ul id="ingredientsList" class="space-y-3 max-h-96 overflow-y-auto pr-4">
                    <!-- Ingredients will be listed here -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        });

        if (localStorage.getItem('theme') === 'dark') {
            html.classList.add('dark');
        }

        const mockRecipes = [
            {
                id: 1,
                label: "Classic Margherita Pizza",
                image: "https://images.unsplash.com/photo-1604068549290-dea0e4a305ca?w=800&q=80",
                calories: 850,
                ingredients: ["Pizza dough", "Tomato sauce", "Fresh mozzarella", "Fresh basil", "Extra virgin olive oil"],
                time: 30,
                diet: "Vegetarian"
            },
            {
                id: 2,
                label: "Creamy Mushroom Risotto",
                image: "https://images.unsplash.com/photo-1476124369491-e7addf5db371?w=800&q=80",
                calories: 620,
                ingredients: ["Arborio rice", "Cremini mushrooms", "Vegetable broth", "Parmesan cheese", "Shallots", "Garlic", "White wine", "Butter"],
                time: 45,
                diet: "Gluten-Free"
            },
            {
                id: 3,
                label: "Fresh Summer Salad",
                image: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=800&q=80",
                calories: 320,
                ingredients: ["Kale", "Quinoa", "Cherry tomatoes", "Cucumber", "Avocado", "Red onion", "Chickpeas", "Lemon dressing", "Sunflower seeds", "Feta cheese", "Bell pepper", "Fresh parsley"],
                time: 15,
                diet: "Vegan"
            },
            {
                id: 4,
                label: "Grilled Atlantic Salmon",
                image: "https://images.unsplash.com/photo-1467003909585-2f8a72700288?w=800&q=80",
                calories: 540,
                ingredients: ["Salmon fillet", "Lemon slices", "Asparagus", "Garlic butter", "Thyme", "Black pepper"],
                time: 25,
                diet: "High-Protein"
            },
            {
                id: 5,
                label: "Avocado Sourdough Toast",
                image: "https://images.unsplash.com/photo-1525351484163-7529414344d8?w=800&q=80",
                calories: 420,
                ingredients: ["Sourdough bread", "Ripe avocado", "Red pepper flakes", "Sea salt"],
                time: 10,
                diet: "Healthy"
            },
            {
                id: 6,
                label: "Berry Blast Smoothie Bowl",
                image: "https://images.unsplash.com/photo-1626074353765-517a681e40be?w=800&q=80",
                calories: 280,
                ingredients: ["Frozen mixed berries", "Banana", "Almond milk", "Granola", "Chia seeds", "Honey", "Coconut flakes"],
                time: 10,
                diet: "Dairy-Free"
            }
        ];

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const recipeGrid = document.getElementById('recipeGrid');
        const loading = document.getElementById('loading');
        const initialState = document.getElementById('initialState');
        const modal = document.getElementById('ingredientsModal');
        const ingredientsList = document.getElementById('ingredientsList');
        const modalTitle = document.getElementById('modalTitle');

        function createRecipeCard(recipe) {
            return `
                <div class="recipe-card glass rounded-[2.5rem] overflow-hidden shadow-xl flex flex-col">
                    <div class="relative h-64 overflow-hidden">
                        <img src="${recipe.image}" alt="${recipe.label}" class="w-full h-full object-cover">
                        <div class="absolute top-4 right-4 px-4 py-2 rounded-full bg-white/90 backdrop-blur-md text-orange-600 font-bold text-sm shadow-lg">
                            ${recipe.diet}
                        </div>
                    </div>
                    <div class="p-8 flex flex-col flex-grow">
                        <h3 class="text-2xl font-serif font-bold text-slate-900 dark:text-white mb-4 line-clamp-1">${recipe.label}</h3>
                        <div class="flex items-center justify-between mt-auto pt-6 border-t border-slate-100 dark:border-slate-800">
                            <div class="flex flex-col items-center">
                                <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-1">Calories</span>
                                <span class="text-slate-900 dark:text-white font-bold">${recipe.calories}</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <span class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-1">Time</span>
                                <span class="text-slate-900 dark:text-white font-bold">${recipe.time}m</span>
                            </div>
                            <button onclick="showIngredients(${recipe.id})" class="flex flex-col items-center group/btn cursor-pointer">
                                <span class="text-slate-400 group-hover/btn:text-orange-500 transition-colors text-xs font-semibold uppercase tracking-wider mb-1">Ingredients</span>
                                <span class="text-slate-900 dark:text-white font-bold group-hover/btn:text-orange-500 transition-colors flex items-center gap-1">
                                    ${recipe.ingredients.length}
                                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function showIngredients(recipeId) {
            const recipe = mockRecipes.find(r => r.id === recipeId);
            if (!recipe) return;

            modalTitle.textContent = recipe.label;
            ingredientsList.innerHTML = recipe.ingredients.map(ing => `
                <li class="flex items-center gap-3 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/50 text-slate-700 dark:text-slate-300 font-medium">
                    <div class="w-2 h-2 rounded-full bg-orange-500"></div>
                    ${ing}
                </li>
            `).join('');

            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function closeModal() {
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        document.getElementById('closeModal').addEventListener('click', closeModal);
        document.getElementById('modalOverlay').addEventListener('click', closeModal);

        async function searchRecipes() {
            const query = searchInput.value.trim();
            if (!query) return;

            initialState.classList.add('hidden');
            loading.classList.remove('hidden');

            const oldCards = recipeGrid.querySelectorAll('.recipe-card');
            oldCards.forEach(card => card.remove());

            await new Promise(resolve => setTimeout(resolve, 800));

            const filteredRecipes = mockRecipes.filter(r =>
                r.label.toLowerCase().includes(query.toLowerCase()) ||
                r.diet.toLowerCase().includes(query.toLowerCase())
            );

            loading.classList.add('hidden');

            if (filteredRecipes.length === 0) {
                recipeGrid.innerHTML += `
                    <div class="col-span-full text-center py-20 text-slate-500">
                        <p class="text-xl">No recipes found for "${query}". Try "Pizza" or "Salad"!</p>
                    </div>
                `;
            } else {
                filteredRecipes.forEach(recipe => {
                    recipeGrid.insertAdjacentHTML('beforeend', createRecipeCard(recipe));
                });
                lucide.createIcons(); // Re-render icons for new cards
            }
        }

        searchBtn.addEventListener('click', searchRecipes);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchRecipes();
        });
    </script>
</body>
</html>
