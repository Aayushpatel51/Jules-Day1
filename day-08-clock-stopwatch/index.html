<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock & Stopwatch - 30 Day Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains+Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .tab-active {
            @apply text-indigo-600 dark:text-indigo-400 border-b-2 border-indigo-600 dark:border-indigo-400;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen font-sans transition-colors duration-300 flex flex-col items-center justify-center p-4">
    <!-- Theme Toggle -->
    <button id="themeToggle" class="fixed top-6 right-6 p-3 rounded-2xl bg-white dark:bg-slate-900 shadow-lg hover:scale-110 transition-all duration-300">
        <i data-lucide="sun" class="w-5 h-5 text-amber-500 hidden dark:block"></i>
        <i data-lucide="moon" class="w-5 h-5 text-indigo-600 block dark:hidden"></i>
    </button>

    <div class="w-full max-w-md">
        <!-- Tabs -->
        <div class="flex justify-center space-x-8 mb-8">
            <button id="clockTab" class="pb-2 text-lg font-semibold transition-all border-b-2 border-transparent text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">Clock</button>
            <button id="stopwatchTab" class="pb-2 text-lg font-semibold transition-all border-b-2 border-transparent text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">Stopwatch</button>
        </div>

        <!-- Clock View -->
        <div id="clockView" class="glass rounded-[2.5rem] p-8 shadow-2xl text-center space-y-6">
            <div class="space-y-1">
                <h2 class="text-slate-500 dark:text-slate-400 font-medium tracking-widest uppercase text-sm">Local Time</h2>
                <div id="currentTime" class="text-6xl md:text-7xl font-bold font-mono tracking-tighter text-slate-900 dark:text-white">
                    00:00:00
                </div>
            </div>
            <div id="currentDate" class="text-slate-600 dark:text-slate-400 font-medium">
                Loading date...
            </div>
        </div>

        <!-- Stopwatch View -->
        <div id="stopwatchView" class="hidden glass rounded-[2.5rem] p-8 shadow-2xl text-center space-y-8">
            <div class="space-y-2">
                <h2 class="text-slate-500 dark:text-slate-400 font-medium tracking-widest uppercase text-sm">Stopwatch</h2>
                <div id="stopwatchDisplay" class="text-6xl md:text-7xl font-bold font-mono tracking-tighter text-slate-900 dark:text-white">
                    00:00.00
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center justify-center space-x-4">
                <button id="lapBtn" class="p-4 rounded-full bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors disabled:opacity-50" disabled>
                    <i data-lucide="timer" class="w-6 h-6"></i>
                </button>
                <button id="startStopBtn" class="p-6 rounded-full bg-indigo-600 text-white hover:bg-indigo-700 shadow-xl shadow-indigo-500/30 transition-all active:scale-95">
                    <i data-lucide="play" id="startStopIcon" class="w-8 h-8 fill-current"></i>
                </button>
                <button id="resetBtn" class="p-4 rounded-full bg-rose-100 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 hover:bg-rose-200 dark:hover:bg-rose-900/50 transition-colors">
                    <i data-lucide="rotate-ccw" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- Laps -->
            <div id="lapsContainer" class="max-h-48 overflow-y-auto pr-2 space-y-2 custom-scrollbar">
                <!-- Laps added here -->
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        });

        if (localStorage.getItem('theme') === 'dark') {
            html.classList.add('dark');
        }

        // Tab Switching
        const clockTab = document.getElementById('clockTab');
        const stopwatchTab = document.getElementById('stopwatchTab');
        const clockView = document.getElementById('clockView');
        const stopwatchView = document.getElementById('stopwatchView');

        function switchTab(tab) {
            if (tab === 'clock') {
                clockTab.classList.add('tab-active');
                stopwatchTab.classList.remove('tab-active');
                clockView.classList.remove('hidden');
                stopwatchView.classList.add('hidden');
            } else {
                stopwatchTab.classList.add('tab-active');
                clockTab.classList.remove('tab-active');
                stopwatchView.classList.remove('hidden');
                clockView.classList.add('hidden');
            }
        }

        clockTab.addEventListener('click', () => switchTab('clock'));
        stopwatchTab.addEventListener('click', () => switchTab('stopwatch'));
        switchTab('clock');

        // Clock Logic
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            const dateString = now.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            document.getElementById('currentTime').textContent = timeString;
            document.getElementById('currentDate').textContent = dateString;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // Stopwatch Logic
        let startTime;
        let elapsedTime = 0;
        let timerInterval;
        let isRunning = false;

        const stopwatchDisplay = document.getElementById('stopwatchDisplay');
        const startStopBtn = document.getElementById('startStopBtn');
        const startStopIcon = document.getElementById('startStopIcon');
        const lapBtn = document.getElementById('lapBtn');
        const resetBtn = document.getElementById('resetBtn');
        const lapsContainer = document.getElementById('lapsContainer');

        function timeToString(time) {
            let diffInMin = time / 60000;
            let mm = Math.floor(diffInMin);

            let diffInSec = (diffInMin - mm) * 60;
            let ss = Math.floor(diffInSec);

            let diffInMs = (diffInSec - ss) * 100;
            let ms = Math.floor(diffInMs);

            let formattedMM = mm.toString().padStart(2, "0");
            let formattedSS = ss.toString().padStart(2, "0");
            let formattedMS = ms.toString().padStart(2, "0");

            return `${formattedMM}:${formattedSS}.${formattedMS}`;
        }

        function print(txt) {
            stopwatchDisplay.innerHTML = txt;
        }

        function start() {
            startTime = Date.now() - elapsedTime;
            timerInterval = setInterval(function printTime() {
                elapsedTime = Date.now() - startTime;
                print(timeToString(elapsedTime));
            }, 10);
            showButton("PAUSE");
            isRunning = true;
            lapBtn.disabled = false;
        }

        function pause() {
            clearInterval(timerInterval);
            showButton("PLAY");
            isRunning = false;
        }

        function reset() {
            clearInterval(timerInterval);
            print("00:00.00");
            elapsedTime = 0;
            showButton("PLAY");
            isRunning = false;
            lapBtn.disabled = true;
            lapsContainer.innerHTML = '';
        }

        function lap() {
            const lapTime = timeToString(elapsedTime);
            const lapElement = document.createElement('div');
            lapElement.className = "flex justify-between items-center p-3 rounded-xl bg-white/50 dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 animate-slide-in";
            const lapCount = lapsContainer.children.length + 1;
            lapElement.innerHTML = `
                <span class="text-slate-500 font-medium">Lap ${lapCount}</span>
                <span class="font-mono font-bold text-slate-900 dark:text-white">${lapTime}</span>
            `;
            lapsContainer.prepend(lapElement);
        }

        function showButton(buttonKey) {
            if (buttonKey === "PLAY") {
                startStopIcon.setAttribute('data-lucide', 'play');
            } else {
                startStopIcon.setAttribute('data-lucide', 'pause');
            }
            lucide.createIcons();
        }

        startStopBtn.addEventListener("click", () => {
            if (isRunning) {
                pause();
            } else {
                start();
            }
        });

        resetBtn.addEventListener("click", reset);
        lapBtn.addEventListener("click", lap);
    </script>
</body>
</html>
