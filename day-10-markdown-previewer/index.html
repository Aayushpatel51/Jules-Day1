<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Previewer - 30 Day Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains+Mono', 'monospace'],
                        serif: ['Playfair Display', 'serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .prose {
            max-width: none;
        }
        .prose h1 { @apply text-3xl font-bold mb-4 dark:text-white; }
        .prose h2 { @apply text-2xl font-bold mb-3 dark:text-white; }
        .prose h3 { @apply text-xl font-bold mb-2 dark:text-white; }
        .prose p { @apply mb-4 text-slate-600 dark:text-slate-300 leading-relaxed; }
        .prose ul { @apply list-disc list-inside mb-4 text-slate-600 dark:text-slate-300; }
        .prose ol { @apply list-decimal list-inside mb-4 text-slate-600 dark:text-slate-300; }
        .prose blockquote { @apply border-l-4 border-indigo-500 pl-4 italic mb-4 text-slate-500 dark:text-slate-400; }
        .prose code { @apply bg-slate-100 dark:bg-slate-800 px-1 rounded font-mono text-indigo-600 dark:text-indigo-400; }
        .prose pre { @apply bg-slate-900 text-slate-100 p-4 rounded-xl mb-4 overflow-x-auto font-mono text-sm; }
        .prose a { @apply text-indigo-600 dark:text-indigo-400 underline hover:no-underline; }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            @apply bg-slate-200 dark:bg-slate-800 rounded-full;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 min-h-screen font-sans transition-colors duration-300 flex flex-col p-4 md:p-8">
    <!-- Header -->
    <header class="flex items-center justify-between mb-8">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-indigo-600 rounded-xl">
                <i data-lucide="file-text" class="w-6 h-6 text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Markdown <span class="text-indigo-600">Pro</span></h1>
        </div>
        <div class="flex items-center gap-4">
            <button id="clearBtn" class="px-4 py-2 text-sm font-medium text-slate-500 hover:text-rose-500 transition-colors">
                Clear Editor
            </button>
            <button id="themeToggle" class="p-3 rounded-2xl bg-white dark:bg-slate-900 shadow-lg hover:scale-110 transition-all duration-300">
                <i data-lucide="sun" class="w-5 h-5 text-amber-500 hidden dark:block"></i>
                <i data-lucide="moon" class="w-5 h-5 text-indigo-600 block dark:hidden"></i>
            </button>
        </div>
    </header>

    <main class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-6 min-h-0">
        <!-- Editor Section -->
        <div class="flex flex-col space-y-3">
            <div class="flex items-center justify-between px-2">
                <span class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Editor</span>
                <span id="charCount" class="text-xs text-slate-400">0 characters</span>
            </div>
            <div class="flex-grow glass rounded-[2rem] overflow-hidden shadow-2xl relative">
                <textarea id="editor" class="w-full h-full p-8 bg-transparent outline-none font-mono text-sm leading-relaxed text-slate-800 dark:text-slate-200 resize-none custom-scrollbar" placeholder="Type some markdown here..."></textarea>
            </div>
        </div>

        <!-- Preview Section -->
        <div class="flex flex-col space-y-3">
            <div class="flex items-center justify-between px-2">
                <span class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Preview</span>
                <button id="downloadBtn" class="text-xs font-semibold text-indigo-600 hover:text-indigo-700 flex items-center gap-1">
                    <i data-lucide="download" class="w-3 h-3"></i>
                    Export HTML
                </button>
            </div>
            <div class="flex-grow glass rounded-[2rem] overflow-y-auto shadow-2xl custom-scrollbar">
                <div id="preview" class="prose p-8 dark:text-slate-200"></div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
        });

        if (localStorage.getItem('theme') === 'dark') {
            html.classList.add('dark');
        }

        // Markdown Logic
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const charCount = document.getElementById('charCount');
        const clearBtn = document.getElementById('clearBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        const defaultContent = `# Welcome to Markdown Pro! 🚀

Enjoy this aesthetic markdown previewer.

## What you can do:
1. Write **Markdown** on the left
2. See the **Preview** on the right
3. Toggle between **Light** and **Dark** modes
4. Export your work as **HTML**

### Code Example:
\`\`\`javascript
function hello() {
  console.log("Hello, World!");
}
\`\`\`

> "Good design is obvious. Great design is transparent." — Joe Sparano

Check out [Lucide Icons](https://lucide.dev) for the icons used here!`;

        function updatePreview() {
            const text = editor.value;
            const dirtyHTML = marked.parse(text);
            const cleanHTML = DOMPurify.sanitize(dirtyHTML);
            preview.innerHTML = cleanHTML;
            charCount.textContent = `${text.length} characters`;
            localStorage.setItem('markdown-content', text);
        }

        editor.addEventListener('input', updatePreview);

        clearBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to clear the editor?')) {
                editor.value = '';
                updatePreview();
            }
        });

        downloadBtn.addEventListener('click', () => {
            const blob = new Blob([preview.innerHTML], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'export.html';
            a.click();
            URL.revokeObjectURL(url);
        });

        // Initialize
        const savedContent = localStorage.getItem('markdown-content');
        editor.value = savedContent !== null ? savedContent : defaultContent;
        updatePreview();
    </script>
</body>
</html>
