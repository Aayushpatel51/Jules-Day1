<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitProfile - 30 Day Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dark .glass {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .profile-image {
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.2);
        }
    </style>
</head>
<body class="bg-[#0A0C10] text-slate-300 min-h-screen font-sans">
    <!-- Background Decor -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-indigo-600/10 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-600/10 blur-[120px] rounded-full"></div>
    </div>

    <main class="relative z-10 max-w-4xl mx-auto px-6 py-12 lg:py-24 space-y-12">
        <!-- Header & Search -->
        <div class="text-center space-y-8">
            <div class="inline-flex items-center gap-3 px-4 py-2 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 font-mono text-sm">
                <i data-lucide="github" class="w-4 h-4"></i>
                <span>GitHub Explorer v1.0</span>
            </div>
            <h1 class="text-5xl lg:text-6xl font-bold text-white tracking-tight">Discover <span class="text-indigo-500">Developers.</span></h1>

            <div class="max-w-2xl mx-auto relative group">
                <input type="text" id="usernameInput" placeholder="Enter GitHub username..."
                    class="w-full px-8 py-5 rounded-2xl bg-white/5 border border-white/10 outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 transition-all text-white pr-16 text-lg">
                <button id="searchBtn" class="absolute right-3 top-3 bottom-3 px-6 rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-500/20">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Result Section -->
        <div id="mainContent" class="hidden animate-in fade-in slide-in-from-bottom-4 duration-700">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- Sidebar: Profile Info -->
                <div class="lg:col-span-1 space-y-6">
                    <div class="glass p-8 rounded-[2rem] text-center">
                        <img id="avatar" src="" alt="" class="w-32 h-32 rounded-full mx-auto mb-6 border-4 border-indigo-500/30 profile-image">
                        <h2 id="name" class="text-2xl font-bold text-white"></h2>
                        <p id="login" class="text-indigo-400 font-mono mb-4"></p>
                        <p id="bio" class="text-sm text-slate-400 mb-6"></p>

                        <div class="grid grid-cols-2 gap-4 pt-6 border-t border-white/10">
                            <div>
                                <p class="text-xs font-mono uppercase text-slate-500">Followers</p>
                                <p id="followers" class="text-xl font-bold text-white"></p>
                            </div>
                            <div>
                                <p class="text-xs font-mono uppercase text-slate-500">Following</p>
                                <p id="following" class="text-xl font-bold text-white"></p>
                            </div>
                        </div>
                    </div>

                    <div class="glass p-6 rounded-[2rem] space-y-4">
                        <div class="flex items-center gap-3 text-sm text-slate-400">
                            <i data-lucide="map-pin" class="w-4 h-4"></i>
                            <span id="location"></span>
                        </div>
                        <div class="flex items-center gap-3 text-sm text-slate-400">
                            <i data-lucide="link" class="w-4 h-4"></i>
                            <a id="blog" href="#" target="_blank" class="hover:text-indigo-400 transition-colors truncate"></a>
                        </div>
                        <div class="flex items-center gap-3 text-sm text-slate-400">
                            <i data-lucide="twitter" class="w-4 h-4"></i>
                            <span id="twitter"></span>
                        </div>
                    </div>
                </div>

                <!-- Main: Repositories -->
                <div class="lg:col-span-2 space-y-6">
                    <h3 class="text-xl font-bold text-white flex items-center gap-2">
                        <i data-lucide="book-open" class="w-5 h-5 text-indigo-500"></i>
                        Popular Repositories
                    </h3>
                    <div id="repoList" class="grid grid-cols-1 gap-4">
                        <!-- Repos load here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- States -->
        <div id="loading" class="hidden text-center py-20">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-500 border-t-transparent"></div>
        </div>

        <div id="error" class="hidden glass p-12 rounded-[2rem] text-center space-y-4">
            <i data-lucide="user-x" class="w-12 h-12 text-red-500 mx-auto"></i>
            <h3 class="text-xl font-bold text-white">Developer not found</h3>
            <p class="text-slate-400">Check the spelling and try again.</p>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const input = document.getElementById('usernameInput');
        const searchBtn = document.getElementById('searchBtn');
        const mainContent = document.getElementById('mainContent');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');

        async function fetchGitHubUser() {
            const username = input.value.trim();
            if (!username) return;

            // UI State
            mainContent.classList.add('hidden');
            error.classList.add('hidden');
            loading.classList.remove('hidden');

            try {
                const [userRes, repoRes] = await Promise.all([
                    fetch(`https://api.github.com/users/${username}`),
                    fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=6`)
                ]);

                if (!userRes.ok) throw new Error('Not Found');

                const user = await userRes.json();
                const repos = await repoRes.json();

                updateProfile(user);
                updateRepos(repos);

                loading.classList.add('hidden');
                mainContent.classList.remove('hidden');
            } catch (err) {
                loading.classList.add('hidden');
                error.classList.remove('hidden');
            }
        }

        function updateProfile(user) {
            document.getElementById('avatar').src = user.avatar_url;
            document.getElementById('name').textContent = user.name || user.login;
            document.getElementById('login').textContent = `@${user.login}`;
            document.getElementById('bio').textContent = user.bio || 'This developer prefers to keep their bio a mystery.';
            document.getElementById('followers').textContent = user.followers;
            document.getElementById('following').textContent = user.following;
            document.getElementById('location').textContent = user.location || 'Remote / Earth';

            const blog = document.getElementById('blog');
            blog.textContent = user.blog ? user.blog.replace('https://', '') : 'Not available';
            blog.href = user.blog ? (user.blog.startsWith('http') ? user.blog : `https://${user.blog}`) : '#';

            document.getElementById('twitter').textContent = user.twitter_username ? `@${user.twitter_username}` : 'Not available';
        }

        function updateRepos(repos) {
            const repoList = document.getElementById('repoList');
            repoList.innerHTML = repos.map(repo => `
                <a href="${repo.html_url}" target="_blank" class="glass p-6 rounded-2xl hover:border-indigo-500/50 transition-all group">
                    <div class="flex justify-between items-start mb-3">
                        <h4 class="font-bold text-white group-hover:text-indigo-400 transition-colors">${repo.name}</h4>
                        <div class="flex items-center gap-3 text-xs font-mono text-slate-500">
                            <span class="flex items-center gap-1">
                                <i data-lucide="star" class="w-3 h-3"></i> ${repo.stargazers_count}
                            </span>
                            <span class="flex items-center gap-1">
                                <i data-lucide="git-fork" class="w-3 h-3"></i> ${repo.forks_count}
                            </span>
                        </div>
                    </div>
                    <p class="text-sm text-slate-400 line-clamp-2 mb-4">${repo.description || 'No description provided.'}</p>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-indigo-500"></span>
                        <span class="text-xs font-mono text-slate-500">${repo.language || 'Markdown'}</span>
                    </div>
                </a>
            `).join('');
            lucide.createIcons();
        }

        searchBtn.addEventListener('click', fetchGitHubUser);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchGitHubUser();
        });
    </script>
</body>
</html>
