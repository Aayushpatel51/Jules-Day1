<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 07: Aesthetic Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-up': 'slideUp 0.4s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px); }
        .dark .glass { background: rgba(15, 23, 42, 0.8); }
        .calc-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .calc-btn:active { transform: scale(0.9); }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 min-h-screen flex items-center justify-center p-6 transition-colors duration-500 font-sans">

    <!-- Theme Toggle -->
    <button id="theme-toggle" class="fixed top-8 right-8 p-3 rounded-2xl bg-white dark:bg-slate-900 shadow-xl border border-slate-100 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:scale-110 active:scale-95 transition-all">
        <i data-lucide="moon" class="hidden dark:block w-5 h-5"></i>
        <i data-lucide="sun" class="block dark:hidden w-5 h-5"></i>
    </button>

    <main class="w-full max-w-sm animate-slide-up">
        <div class="glass border border-white dark:border-slate-800 rounded-[2.5rem] shadow-2xl overflow-hidden">

            <!-- Display -->
            <div class="p-10 pb-6 text-right space-y-2">
                <div id="prev-op" class="text-sm font-medium text-slate-400 dark:text-slate-500 h-6 overflow-hidden"></div>
                <div id="display" class="text-5xl font-mono font-bold text-slate-800 dark:text-white overflow-hidden whitespace-nowrap">0</div>
            </div>

            <!-- Buttons Grid -->
            <div class="p-6 grid grid-cols-4 gap-4">
                <!-- Row 1 -->
                <button data-action="clear" class="calc-btn col-span-1 p-5 rounded-2xl bg-rose-50 dark:bg-rose-500/10 text-rose-500 font-bold hover:bg-rose-100 dark:hover:bg-rose-500/20">AC</button>
                <button data-action="percent" class="calc-btn p-5 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold hover:bg-slate-200 dark:hover:bg-slate-700">%</button>
                <button data-action="delete" class="calc-btn p-5 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-bold hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center">
                    <i data-lucide="delete" class="w-5 h-5"></i>
                </button>
                <button data-op="/" class="calc-btn p-5 rounded-2xl bg-indigo-500 text-white font-bold hover:bg-indigo-600 shadow-lg shadow-indigo-200 dark:shadow-none">÷</button>

                <!-- Row 2 -->
                <button data-num="7" class="calc-btn p-5 rounded-2xl bg-white dark:bg-slate-800/50 text-slate-700 dark:text-slate-200 font-bold border border-slate-100 dark:border-slate-800 hover:shadow-md">7</button>
                <button data-num="8" class="calc-btn p-5 rounded-2xl bg-white dark:bg-slate-800/50 text-slate-700 dark:text-slate-200 font-bold border border-slate-100 dark:border-slate-800 hover:shadow-md">8</button>
                <button data-num="9" class="calc-btn p-5 rounded-2xl bg-white dark:bg-slate-800/50 text-slate-700 dark:text-slate-200 font-bold border border-slate-100 dark:border-slate-800 hover:shadow-md">9</button>
                <button data-op="*" class="calc-btn p-5 rounded-2xl bg-indigo-500 text-white font-bold hover:bg-indigo-600 shadow-lg shadow-indigo-200 dark:shadow-none">×</button>

                <!-- Row 3 -->
                <button data-num="4" class="calc-btn p-5 rounded-2xl bg-white dark:bg-slate-800/50 text-slate-700 dark:text-slate-200 font-bold border border-slate-100 dark:border-slate-800 hover:shadow-md">4</button>
                <button data-num="5" class="calc-btn p-5 rounded-2xl bg-white dark:bg-slate-800/50 text-slate-700 dark:text-slate-200 font-bold border border-slate-100 dark:border-slate-800 hover:shadow-md">5</button>
                <button data-num="6" class="calc-btn p-5 rounded-2xl bg-white dark:bg-slate-800/50 text-slate-700 dark:text-slate-200 font-bold border border-slate-100 dark:border-slate-800 hover:shadow-md">6</button>
                <button data-op="-" class="calc-btn p-5 rounded-2xl bg-indigo-500 text-white font-bold hover:bg-indigo-600 shadow-lg shadow-indigo-200 dark:shadow-none">−</button>

                <!-- Row 4 -->
                <button data-num="1" class="calc-btn p-5 rounded-2xl bg-white dark:bg-slate-800/50 text-slate-700 dark:text-slate-200 font-bold border border-slate-100 dark:border-slate-800 hover:shadow-md">1</button>
                <button data-num="2" class="calc-btn p-5 rounded-2xl bg-white dark:bg-slate-800/50 text-slate-700 dark:text-slate-200 font-bold border border-slate-100 dark:border-slate-800 hover:shadow-md">2</button>
                <button data-num="3" class="calc-btn p-5 rounded-2xl bg-white dark:bg-slate-800/50 text-slate-700 dark:text-slate-200 font-bold border border-slate-100 dark:border-slate-800 hover:shadow-md">3</button>
                <button data-op="+" class="calc-btn p-5 rounded-2xl bg-indigo-500 text-white font-bold hover:bg-indigo-600 shadow-lg shadow-indigo-200 dark:shadow-none">+</button>

                <!-- Row 5 -->
                <button data-num="0" class="calc-btn col-span-2 p-5 rounded-2xl bg-white dark:bg-slate-800/50 text-slate-700 dark:text-slate-200 font-bold border border-slate-100 dark:border-slate-800 hover:shadow-md">0</button>
                <button data-action="dot" class="calc-btn p-5 rounded-2xl bg-white dark:bg-slate-800/50 text-slate-700 dark:text-slate-200 font-bold border border-slate-100 dark:border-slate-800 hover:shadow-md">.</button>
                <button data-action="equals" class="calc-btn p-5 rounded-2xl bg-indigo-500 text-white font-bold hover:bg-indigo-600 shadow-lg shadow-indigo-200 dark:shadow-none">=</button>
            </div>
        </div>
    </main>

    <script>
        // State
        let currentInput = '0';
        let previousInput = '';
        let operation = null;
        let shouldResetDisplay = false;

        // Selectors
        const display = document.getElementById('display');
        const prevOpDisplay = document.getElementById('prev-op');
        const themeToggle = document.getElementById('theme-toggle');
        const buttons = document.querySelectorAll('.calc-btn');

        function init() {
            lucide.createIcons();
            setupTheme();
        }

        function setupTheme() {
            if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
            themeToggle.addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
                localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
            });
        }

        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                const num = btn.dataset.num;
                const op = btn.dataset.op;
                const action = btn.dataset.action;

                if (num) handleNumber(num);
                if (op) handleOperation(op);
                if (action) handleAction(action);
                updateDisplay();
            });
        });

        function handleNumber(num) {
            if (currentInput === '0' || shouldResetDisplay) {
                currentInput = num;
                shouldResetDisplay = false;
            } else {
                currentInput += num;
            }
        }

        function handleOperation(op) {
            if (operation !== null) calculate();
            previousInput = currentInput;
            operation = op;
            shouldResetDisplay = true;
        }

        function handleAction(action) {
            switch (action) {
                case 'clear':
                    currentInput = '0';
                    previousInput = '';
                    operation = null;
                    break;
                case 'delete':
                    if (currentInput.length > 1) currentInput = currentInput.slice(0, -1);
                    else currentInput = '0';
                    break;
                case 'percent':
                    currentInput = (parseFloat(currentInput) / 100).toString();
                    break;
                case 'dot':
                    if (!currentInput.includes('.')) currentInput += '.';
                    break;
                case 'equals':
                    if (operation === null) return;
                    calculate();
                    operation = null;
                    break;
            }
        }

        function calculate() {
            let result;
            const prev = parseFloat(previousInput);
            const current = parseFloat(currentInput);
            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': result = prev / current; break;
                default: return;
            }

            currentInput = result.toString();
            previousInput = '';
        }

        function updateDisplay() {
            display.textContent = currentInput;
            if (operation) {
                prevOpDisplay.textContent = `${previousInput} ${operation === '*' ? '×' : operation === '/' ? '÷' : operation}`;
            } else {
                prevOpDisplay.textContent = '';
            }
        }

        init();
    </script>
</body>
</html>
