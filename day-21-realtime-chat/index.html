<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocketFlow - 30 Day Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        .terminal-glow {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
        }
        .message-anim {
            animation: slideUp 0.3s ease-out forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#0B0E14] min-h-screen font-sans text-slate-300 p-4 md:p-12 flex items-center justify-center">
    <div class="max-w-5xl w-full grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- Connection Info -->
        <div class="lg:col-span-4 space-y-6">
            <div class="p-8 bg-[#151921] rounded-[2rem] border border-white/5 terminal-glow">
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center">
                        <i data-lucide="zap" class="w-6 h-6 text-white"></i>
                    </div>
                    <h1 class="text-xl font-bold text-white">SocketFlow</h1>
                </div>

                <div class="space-y-6">
                    <div>
                        <p class="text-xs font-mono uppercase text-slate-500 mb-2">Connection Status</p>
                        <div class="flex items-center gap-2">
                            <div id="statusDot" class="w-2 h-2 bg-yellow-500 rounded-full animate-pulse"></div>
                            <span id="statusText" class="text-sm font-mono text-yellow-500">Connecting...</span>
                        </div>
                    </div>

                    <div>
                        <p class="text-xs font-mono uppercase text-slate-500 mb-2">Server Latency</p>
                        <p id="latency" class="text-xl font-mono text-white">-- ms</p>
                    </div>

                    <div class="pt-6 border-t border-white/5">
                        <p class="text-xs font-mono uppercase text-slate-500 mb-4">Active Participants</p>
                        <div class="flex -space-x-2">
                            <img src="https://i.pravatar.cc/100?u=1" class="w-8 h-8 rounded-full border-2 border-[#151921]">
                            <img src="https://i.pravatar.cc/100?u=2" class="w-8 h-8 rounded-full border-2 border-[#151921]">
                            <img src="https://i.pravatar.cc/100?u=3" class="w-8 h-8 rounded-full border-2 border-[#151921]">
                            <div class="w-8 h-8 rounded-full border-2 border-[#151921] bg-indigo-600 flex items-center justify-center text-[10px] font-bold text-white">+12</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="p-6 bg-indigo-600/10 border border-indigo-500/20 rounded-3xl">
                <p class="text-sm text-indigo-400 font-medium">
                    <i data-lucide="info" class="inline w-4 h-4 mr-2 -mt-1"></i>
                    This interface simulates a real-time WebSocket stream using local event emitters.
                </p>
            </div>
        </div>

        <!-- Chat Console -->
        <div class="lg:col-span-8 bg-[#151921] rounded-[2.5rem] border border-white/5 overflow-hidden flex flex-col h-[700px] terminal-glow">
            <!-- Terminal Header -->
            <div class="px-8 py-4 bg-black/20 border-b border-white/5 flex items-center justify-between">
                <div class="flex gap-2">
                    <div class="w-3 h-3 rounded-full bg-red-500/20"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500/20"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500/20"></div>
                </div>
                <span class="text-[10px] font-mono text-slate-500">ws://socket.flow.internal:8080</span>
            </div>

            <!-- Messages Area -->
            <div id="logs" class="flex-grow p-8 font-mono text-sm space-y-3 overflow-y-auto">
                <p class="text-slate-500">[SYSTEM] Initializing stream...</p>
                <p class="text-slate-500">[SYSTEM] Handshake successful.</p>
            </div>

            <!-- Input Bar -->
            <div class="p-6 bg-black/20 border-t border-white/5">
                <form id="chatForm" class="flex gap-4">
                    <input type="text" id="chatInput" placeholder="Send a message to the cluster..."
                        class="flex-grow bg-slate-900/50 border border-white/5 rounded-xl px-6 py-4 outline-none focus:border-indigo-500 transition-all font-mono text-sm text-white">
                    <button class="px-8 py-4 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all flex items-center gap-2">
                        <span>Send</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const logs = document.getElementById('logs');
        const form = document.getElementById('chatForm');
        const input = document.getElementById('chatInput');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const latency = document.getElementById('latency');

        // Simulate Connection
        setTimeout(() => {
            statusDot.classList.replace('bg-yellow-500', 'bg-green-500');
            statusDot.classList.remove('animate-pulse');
            statusText.textContent = 'CONNECTED';
            statusText.classList.replace('text-yellow-500', 'text-green-500');
            latency.textContent = '24 ms';
            addLog('SYSTEM', 'Node cluster reachable. Data stream open.', 'indigo');
        }, 2000);

        function addLog(user, msg, color = 'slate') {
            const colors = {
                indigo: 'text-indigo-400',
                slate: 'text-slate-500',
                green: 'text-green-400',
                white: 'text-white'
            };

            const time = new Date().toLocaleTimeString([], { hour12: false });
            const p = document.createElement('p');
            p.className = 'message-anim';
            p.innerHTML = `<span class="text-slate-600">[${time}]</span> <span class="${colors[color]} font-bold">[${user}]</span> <span class="text-slate-300">${msg}</span>`;
            logs.appendChild(p);
            logs.scrollTop = logs.scrollHeight;
        }

        form.onsubmit = (e) => {
            e.preventDefault();
            const val = input.value.trim();
            if (!val) return;

            addLog('CLIENT', val, 'white');
            input.value = '';

            // Simulate Network delay + Server reply
            setTimeout(() => {
                const replies = [
                    "Message acknowledged by cluster-01.",
                    "Executing logic in sandbox...",
                    "Broadcasted to 14 connected nodes.",
                    "Payload received: size=248b",
                    "Echo: " + val
                ];
                addLog('SERVER', replies[Math.floor(Math.random() * replies.length)], 'green');
                latency.textContent = (Math.floor(Math.random() * 15) + 20) + ' ms';
            }, 600);
        };

        // Random simulated background traffic
        setInterval(() => {
            if (Math.random() > 0.85) {
                const names = ['ALPHA', 'SIGMA', 'NODEX', 'ROOT'];
                const traffic = ['Heartbeat pulse detected.', 'Syncing global state...', 'Worker-07 detached.', 'Buffer cleared.'];
                addLog(names[Math.floor(Math.random() * names.length)], traffic[Math.floor(Math.random() * traffic.length)], 'slate');
            }
        }, 5000);
    </script>
</body>
</html>
