<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocketFlow - 30 Day Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        .terminal-glow {
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
        }
        .message-anim {
            animation: slideUp 0.3s ease-out forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#0B0E14] min-h-screen font-sans text-slate-300 p-4 md:p-12 flex items-center justify-center">
    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 gap-8">

        <!-- User A Chat -->
        <div class="bg-[#151921] rounded-[2.5rem] border border-white/5 overflow-hidden flex flex-col h-[600px] terminal-glow">
            <div class="px-8 py-6 bg-black/20 border-b border-white/5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center text-white font-bold">A</div>
                    <div>
                        <h2 class="text-white font-bold text-sm">User Alpha</h2>
                        <span class="text-[10px] font-mono text-green-500 uppercase tracking-widest">Active Now</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <div class="w-3 h-3 rounded-full bg-red-500/20"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500/20"></div>
                </div>
            </div>

            <div id="logs-A" class="flex-grow p-8 font-mono text-sm space-y-4 overflow-y-auto">
                <p class="text-slate-500 text-center text-xs">[ Connected to Secure Channel ]</p>
            </div>

            <div class="p-6 bg-black/20 border-t border-white/5">
                <form id="form-A" class="flex gap-3">
                    <input type="text" id="input-A" placeholder="Type as Alpha..."
                        class="flex-grow bg-slate-900/50 border border-white/5 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 transition-all font-mono text-xs text-white">
                    <button class="p-4 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all">
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- User B Chat -->
        <div class="bg-[#151921] rounded-[2.5rem] border border-white/5 overflow-hidden flex flex-col h-[600px] terminal-glow">
            <div class="px-8 py-6 bg-black/20 border-b border-white/5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center text-white font-bold">B</div>
                    <div>
                        <h2 class="text-white font-bold text-sm">User Sigma</h2>
                        <span class="text-[10px] font-mono text-green-500 uppercase tracking-widest">Active Now</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <div class="w-3 h-3 rounded-full bg-red-500/20"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500/20"></div>
                </div>
            </div>

            <div id="logs-B" class="flex-grow p-8 font-mono text-sm space-y-4 overflow-y-auto">
                <p class="text-slate-500 text-center text-xs">[ Connected to Secure Channel ]</p>
            </div>

            <div class="p-6 bg-black/20 border-t border-white/5">
                <form id="form-B" class="flex gap-3">
                    <input type="text" id="input-B" placeholder="Type as Sigma..."
                        class="flex-grow bg-slate-900/50 border border-white/5 rounded-xl px-4 py-3 outline-none focus:border-emerald-500 transition-all font-mono text-xs text-white">
                    <button class="p-4 bg-emerald-600 text-white rounded-xl font-bold hover:bg-emerald-700 transition-all">
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Local communication for the same-page demo
        const eventBus = new EventTarget();

        function appendMessage(targetId, user, msg, type = 'sent') {
            const logs = document.getElementById(`logs-${targetId}`);
            const time = new Date().toLocaleTimeString([], { hour12: false, minute: '2-digit', hour: '2-digit' });

            const div = document.createElement('div');
            div.className = `message-anim flex flex-col ${type === 'sent' ? 'items-end' : 'items-start'}`;

            const bgColor = targetId === 'A'
                ? (type === 'sent' ? 'bg-indigo-600' : 'bg-slate-800')
                : (type === 'sent' ? 'bg-emerald-600' : 'bg-slate-800');

            div.innerHTML = `
                <div class="flex items-center gap-2 mb-1 px-1">
                    <span class="text-[10px] font-bold text-slate-500 uppercase tracking-tighter">${user}</span>
                    <span class="text-[10px] text-slate-600">${time}</span>
                </div>
                <div class="max-w-[80%] px-4 py-2 rounded-2xl ${bgColor} text-white text-xs leading-relaxed">
                    ${msg}
                </div>
            `;

            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
        }

        function setupChat(id, name, otherId, otherName) {
            const form = document.getElementById(`form-${id}`);
            const input = document.getElementById(`input-${id}`);

            form.onsubmit = (e) => {
                e.preventDefault();
                const val = input.value.trim();
                if (!val) return;

                // 1. Show in current window as 'sent'
                appendMessage(id, name, val, 'sent');

                // 2. Trigger local event
                eventBus.dispatchEvent(new CustomEvent('message', {
                    detail: { fromId: id, fromName: name, msg: val }
                }));

                input.value = '';
            };
        }

        eventBus.addEventListener('message', (e) => {
            const { fromId, fromName, msg } = e.detail;
            // When A sends, B receives and vice versa
            const targetId = fromId === 'A' ? 'B' : 'A';
            appendMessage(targetId, fromName, msg, 'received');
        });

        setupChat('A', 'ALPHA', 'B', 'SIGMA');
        setupChat('B', 'SIGMA', 'A', 'ALPHA');

        // Initial welcome messages
        setTimeout(() => {
            appendMessage('A', 'SIGMA', 'Hey Alpha! Ready for the cluster sync?', 'received');
            appendMessage('B', 'ALPHA', 'Ready when you are. Checking nodes...', 'received');
        }, 1000);
    </script>
</body>
</html>
