<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudDrop - File Uploader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .drop-zone {
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='40' ry='40' stroke='%236366f1FF' stroke-width='3' stroke-dasharray='10%2c 15' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
            transition: all 0.3s ease;
        }
        .drop-zone.active {
            background-color: rgba(99, 102, 241, 0.05);
            transform: scale(1.02);
        }
        .progress-fill { transition: width 0.3s ease; }
    </style>
</head>
<body class="bg-[#F8FAFC] min-h-screen font-sans text-slate-900 flex items-center justify-center p-6">

    <div class="max-w-2xl w-full space-y-8">
        <!-- Header -->
        <div class="text-center space-y-4">
            <div class="w-20 h-20 bg-indigo-600 rounded-[2.5rem] flex items-center justify-center mx-auto shadow-2xl shadow-indigo-100 mb-6">
                <i data-lucide="cloud-upload" class="text-white w-10 h-10"></i>
            </div>
            <h1 class="text-4xl font-black tracking-tighter">CloudDrop</h1>
            <p class="text-slate-500 font-medium">Securely upload and share your files in seconds.</p>
        </div>

        <!-- Uploader -->
        <div id="dropZone" class="drop-zone bg-white p-16 rounded-[3rem] text-center space-y-6 cursor-pointer relative group">
            <input type="file" id="fileInput" class="hidden" multiple>
            <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto group-hover:scale-110 transition-all">
                <i data-lucide="file-plus" class="text-slate-400 w-8 h-8"></i>
            </div>
            <div>
                <p class="text-xl font-bold">Drag & drop files here</p>
                <p class="text-slate-400 text-sm font-medium mt-1">or click to browse from your computer</p>
            </div>
            <div class="flex justify-center gap-8 text-[10px] font-black uppercase tracking-[0.2em] text-slate-300">
                <span>PNG, JPG, PDF</span>
                <span>Max 100MB</span>
            </div>
        </div>

        <!-- Active Uploads -->
        <div id="uploadsList" class="space-y-4">
            <!-- Upload items appear here -->
        </div>
    </div>

    <script>
        lucide.createIcons();

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadsList = document.getElementById('uploadsList');

        dropZone.onclick = () => fileInput.click();

        dropZone.ondragover = (e) => {
            e.preventDefault();
            dropZone.classList.add('active');
        };

        dropZone.ondragleave = () => {
            dropZone.classList.remove('active');
        };

        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            handleFiles(e.dataTransfer.files);
        };

        fileInput.onchange = (e) => {
            handleFiles(e.target.files);
        };

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                createUploadItem(file);
            });
        }

        function createUploadItem(file) {
            const id = Math.random().toString(36).substring(7);
            const item = document.createElement('div');
            item.className = 'bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex items-center gap-6 animate-in slide-in-from-bottom-4';
            item.innerHTML = `
                <div class="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center">
                    <i data-lucide="file" class="text-slate-400 w-6 h-6"></i>
                </div>
                <div class="flex-grow space-y-2">
                    <div class="flex justify-between items-center">
                        <p class="text-sm font-bold truncate max-w-[200px]">${file.name}</p>
                        <span id="percent-${id}" class="text-xs font-black text-indigo-600">0%</span>
                    </div>
                    <div class="h-2 w-full bg-slate-50 rounded-full overflow-hidden">
                        <div id="bar-${id}" class="progress-fill h-full bg-indigo-600 w-0"></div>
                    </div>
                </div>
                <button onclick="this.parentElement.remove()" class="text-slate-300 hover:text-red-500 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            `;
            uploadsList.appendChild(item);
            lucide.createIcons();
            simulateUpload(id);
        }

        function simulateUpload(id) {
            let progress = 0;
            const bar = document.getElementById(`bar-${id}`);
            const percent = document.getElementById(`percent-${id}`);

            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 15) + 5;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    setTimeout(() => {
                        percent.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i> Done';
                        lucide.createIcons();
                    }, 500);
                }
                bar.style.width = `${progress}%`;
                percent.textContent = `${progress}%`;
            }, 300);
        }
    </script>
</body>
</html>
