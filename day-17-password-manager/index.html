<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PassGuard - 30 Day Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style>
        .strength-bar { transition: width 0.4s ease, background-color 0.4s ease; }
        .gradient-text {
            background: linear-gradient(to right, #6366f1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-[#0F172A] min-h-screen font-sans text-slate-300 flex items-center justify-center p-6">
    <div class="max-w-xl w-full">
        <!-- Header -->
        <div class="text-center mb-12 space-y-4">
            <div class="inline-block p-4 rounded-3xl bg-indigo-500/10 border border-indigo-500/20 mb-4">
                <i data-lucide="shield-check" class="w-10 h-10 text-indigo-500"></i>
            </div>
            <h1 class="text-5xl font-bold text-white tracking-tight">Pass<span class="gradient-text">Guard</span></h1>
            <p class="text-slate-400">Generate unhackable passwords instantly.</p>
        </div>

        <!-- Main Card -->
        <div class="bg-slate-900/50 backdrop-blur-xl rounded-[2.5rem] border border-white/5 p-10 shadow-2xl space-y-8">
            <!-- Output -->
            <div class="space-y-4">
                <div class="relative group">
                    <input type="text" id="passwordOutput" readonly placeholder="P4ssw0rd!"
                        class="w-full bg-slate-950 border border-white/5 rounded-2xl px-8 py-6 text-2xl font-mono text-white tracking-wider outline-none focus:border-indigo-500/50 transition-all">
                    <button id="copyBtn" class="absolute right-4 top-1/2 -translate-y-1/2 p-4 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-all flex items-center gap-2 group-active:scale-90">
                        <i data-lucide="copy" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="flex gap-3">
                    <input type="text" id="passwordLabel" placeholder="Enter title (e.g. Instagram)"
                        class="flex-grow bg-slate-950 border border-white/5 rounded-2xl px-6 py-4 text-sm font-medium text-white outline-none focus:border-indigo-500/50 transition-all">
                    <button id="saveBtn" class="px-8 py-4 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 transition-all flex items-center gap-2">
                        <i data-lucide="save" class="w-5 h-5"></i>
                        <span>Save</span>
                    </button>
                </div>
            </div>

            <!-- Strength Meter -->
            <div class="space-y-3">
                <div class="flex justify-between text-xs font-bold uppercase tracking-widest">
                    <span>Password Strength</span>
                    <span id="strengthText" class="text-slate-500">Too Weak</span>
                </div>
                <div class="h-2 w-full bg-slate-800 rounded-full overflow-hidden">
                    <div id="strengthBar" class="strength-bar h-full bg-slate-600 w-0"></div>
                </div>
            </div>

            <!-- Settings -->
            <div class="space-y-6">
                <div>
                    <div class="flex justify-between items-center mb-4">
                        <label class="text-sm font-bold uppercase text-slate-400">Length: <span id="lengthVal" class="text-white ml-1">16</span></label>
                    </div>
                    <input type="range" id="lengthSlider" min="8" max="64" value="16"
                        class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <label class="flex items-center gap-4 p-4 rounded-2xl bg-slate-950/50 border border-white/5 cursor-pointer hover:border-indigo-500/30 transition-all">
                        <input type="checkbox" id="uppercase" checked class="w-5 h-5 rounded border-slate-700 text-indigo-600 focus:ring-indigo-500 bg-slate-800">
                        <span class="text-sm font-medium">Uppercase</span>
                    </label>
                    <label class="flex items-center gap-4 p-4 rounded-2xl bg-slate-950/50 border border-white/5 cursor-pointer hover:border-indigo-500/30 transition-all">
                        <input type="checkbox" id="numbers" checked class="w-5 h-5 rounded border-slate-700 text-indigo-600 focus:ring-indigo-500 bg-slate-800">
                        <span class="text-sm font-medium">Numbers</span>
                    </label>
                    <label class="flex items-center gap-4 p-4 rounded-2xl bg-slate-950/50 border border-white/5 cursor-pointer hover:border-indigo-500/30 transition-all">
                        <input type="checkbox" id="symbols" checked class="w-5 h-5 rounded border-slate-700 text-indigo-600 focus:ring-indigo-500 bg-slate-800">
                        <span class="text-sm font-medium">Symbols</span>
                    </label>
                    <button id="generateBtn" class="flex items-center justify-center gap-3 bg-white text-slate-950 py-4 rounded-2xl font-bold hover:bg-slate-200 transition-all active:scale-95">
                        <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                        <span>Generate</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Saved Passwords Section -->
        <div class="mt-12 space-y-6">
            <div class="flex items-center justify-between">
                <h3 class="text-xl font-bold text-white">Saved Vault</h3>
                <span id="vaultCount" class="px-3 py-1 bg-slate-800 rounded-full text-xs font-bold text-slate-400">0 Items</span>
            </div>
            <div id="passwordVault" class="space-y-4 max-h-[400px] overflow-y-auto pr-2 custom-scrollbar">
                <!-- Saved items will appear here -->
            </div>
        </div>

        <!-- Tip -->
        <div class="mt-8 flex items-center gap-3 text-slate-500 text-sm justify-center">
            <i data-lucide="info" class="w-4 h-4"></i>
            <span>All passwords are stored locally in your browser.</span>
        </div>
    </div>

    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
    </style>

    <script>
        lucide.createIcons();

        let savedPasswords = JSON.parse(localStorage.getItem('vault')) || [];
        const lengthSlider = document.getElementById('lengthSlider');
        const lengthVal = document.getElementById('lengthVal');
        const generateBtn = document.getElementById('generateBtn');
        const output = document.getElementById('passwordOutput');
        const labelInput = document.getElementById('passwordLabel');
        const saveBtn = document.getElementById('saveBtn');
        const vault = document.getElementById('passwordVault');
        const vaultCount = document.getElementById('vaultCount');
        const copyBtn = document.getElementById('copyBtn');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');

        const chars = {
            lower: 'abcdefghijklmnopqrstuvwxyz',
            upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+~`|}{[]:;?><,./-='
        };

        lengthSlider.addEventListener('input', (e) => {
            lengthVal.textContent = e.target.value;
            generatePassword();
        });

        function generatePassword() {
            let charset = chars.lower;
            if (document.getElementById('uppercase').checked) charset += chars.upper;
            if (document.getElementById('numbers').checked) charset += chars.numbers;
            if (document.getElementById('symbols').checked) charset += chars.symbols;

            let password = '';
            const len = lengthSlider.value;

            for (let i = 0; i < len; i++) {
                password += charset.charAt(Math.floor(Math.random() * charset.length));
            }

            output.value = password;
            updateStrength(password);
        }

        function updateStrength(pwd) {
            let strength = 0;
            if (pwd.length > 12) strength += 1;
            if (pwd.length > 20) strength += 1;
            if (/[A-Z]/.test(pwd)) strength += 1;
            if (/[0-9]/.test(pwd)) strength += 1;
            if (/[^A-Za-z0-9]/.test(pwd)) strength += 1;

            const levels = [
                { color: '#ef4444', text: 'Very Weak', width: '20%' },
                { color: '#f97316', text: 'Weak', width: '40%' },
                { color: '#eab308', text: 'Moderate', width: '60%' },
                { color: '#22c55e', text: 'Strong', width: '80%' },
                { color: '#6366f1', text: 'Secure', width: '100%' }
            ];

            const level = levels[Math.min(strength - 1, 4)] || levels[0];
            strengthBar.style.width = level.width;
            strengthBar.style.backgroundColor = level.color;
            strengthText.textContent = level.text;
            strengthText.style.color = level.color;
        }

        generateBtn.addEventListener('click', generatePassword);

        async function copyToClipboard(text, btn) {
            await navigator.clipboard.writeText(text);
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="check" class="w-5 h-5"></i>';
            btn.classList.add('text-green-500');
            lucide.createIcons();
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('text-green-500');
                lucide.createIcons();
            }, 2000);
        }

        copyBtn.addEventListener('click', () => copyToClipboard(output.value, copyBtn));

        function savePassword() {
            const label = labelInput.value.trim() || 'Untitled Password';
            const pwd = output.value;
            if (!pwd) return;

            savedPasswords.unshift({ label, pwd, id: Date.now() });
            localStorage.setItem('vault', JSON.stringify(savedPasswords));
            labelInput.value = '';
            renderVault();
        }

        function deleteSaved(id) {
            savedPasswords = savedPasswords.filter(p => p.id !== id);
            localStorage.setItem('vault', JSON.stringify(savedPasswords));
            renderVault();
        }

        function renderVault() {
            vault.innerHTML = '';
            vaultCount.textContent = `${savedPasswords.length} Items`;

            if (savedPasswords.length === 0) {
                vault.innerHTML = `
                    <div class="text-center py-10 bg-slate-900/30 rounded-3xl border border-dashed border-white/5">
                        <p class="text-slate-500 text-sm font-medium">Your vault is empty</p>
                    </div>
                `;
                return;
            }

            savedPasswords.forEach(item => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-6 bg-slate-900/50 rounded-3xl border border-white/5 hover:border-indigo-500/20 transition-all group animate-in slide-in-from-top-4 duration-300';
                div.innerHTML = `
                    <div class="overflow-hidden pr-4">
                        <p class="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-1">${item.label}</p>
                        <p class="text-white font-mono truncate tracking-wider">${item.pwd}</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="copyToClipboard('${item.pwd}', this)" class="p-3 text-slate-400 hover:text-white transition-colors">
                            <i data-lucide="copy" class="w-5 h-5"></i>
                        </button>
                        <button onclick="deleteSaved(${item.id})" class="p-3 text-slate-500 hover:text-red-500 transition-colors">
                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                        </button>
                    </div>
                `;
                vault.appendChild(div);
            });
            lucide.createIcons();
        }

        saveBtn.addEventListener('click', savePassword);

        // Initial
        generatePassword();
        renderVault();
    </script>
</body>
</html>
