<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoDash - Crypto Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .crypto-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        .crypto-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99, 102, 241, 0.3);
            background: rgba(15, 23, 42, 0.9);
        }
        .gradient-text {
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#020617] min-h-screen font-sans text-slate-300">

    <nav class="border-b border-white/5 px-8 py-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center">
                    <i data-lucide="line-chart" class="w-6 h-6 text-white"></i>
                </div>
                <span class="text-2xl font-black text-white tracking-tight">Crypto<span class="gradient-text">Dash</span></span>
            </div>
            <div class="hidden md:flex items-center gap-8 text-xs font-bold uppercase tracking-widest text-slate-500">
                <span class="text-green-500">Market Up +2.4%</span>
                <span>Total Cap: $2.4T</span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-8 py-12 space-y-12">
        <!-- Search & Filter -->
        <div class="flex flex-col md:flex-row gap-6 justify-between items-center">
            <div class="relative w-full max-w-md">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 w-5 h-5"></i>
                <input type="text" id="searchInput" placeholder="Search by name or symbol..."
                    class="w-full bg-slate-900 border border-white/5 rounded-2xl pl-12 pr-6 py-4 outline-none focus:border-indigo-500 transition-all text-white">
            </div>
            <div class="flex gap-4">
                <button class="px-6 py-4 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 transition-all">Top Gainers</button>
                <button id="refreshBtn" class="p-4 bg-slate-900 border border-white/5 rounded-2xl hover:bg-slate-800 transition-all">
                    <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Grid -->
        <div id="cryptoGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cards will be injected here -->
        </div>

        <div id="loading" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent"></div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        const cryptoGrid = document.getElementById('cryptoGrid');
        const loading = document.getElementById('loading');
        const searchInput = document.getElementById('searchInput');
        const refreshBtn = document.getElementById('refreshBtn');

        let coins = [];

        async function fetchPrices() {
            loading.classList.remove('hidden');
            cryptoGrid.innerHTML = '';

            try {
                const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=12&page=1&sparkline=false');
                coins = await res.json();
                renderCoins(coins);
            } catch (err) {
                console.error("Coingecko limit or error", err);
                // Mock data for stability if API fails
                coins = [
                    { name: 'Bitcoin', symbol: 'btc', current_price: 64201, price_change_percentage_24h: 2.4, image: 'https://assets.coingecko.com/coins/images/1/large/bitcoin.png' },
                    { name: 'Ethereum', symbol: 'eth', current_price: 3452, price_change_percentage_24h: -1.2, image: 'https://assets.coingecko.com/coins/images/279/large/ethereum.png' },
                    { name: 'Solana', symbol: 'sol', current_price: 145.20, price_change_percentage_24h: 8.5, image: 'https://assets.coingecko.com/coins/images/4128/large/solana.png' },
                    { name: 'Polkadot', symbol: 'dot', current_price: 7.20, price_change_percentage_24h: 0.5, image: 'https://assets.coingecko.com/coins/images/12171/large/polkadot.png' }
                ];
                renderCoins(coins);
            } finally {
                loading.classList.add('hidden');
            }
        }

        function renderCoins(data) {
            cryptoGrid.innerHTML = '';
            data.forEach(coin => {
                const isPositive = coin.price_change_percentage_24h >= 0;
                const card = document.createElement('div');
                card.className = 'crypto-card p-8 rounded-[2.5rem] space-y-6';
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex items-center gap-4">
                            <img src="${coin.image}" class="w-12 h-12 rounded-full">
                            <div>
                                <h3 class="font-bold text-white text-lg">${coin.name}</h3>
                                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">${coin.symbol}</p>
                            </div>
                        </div>
                        <div class="px-3 py-1 rounded-full text-[10px] font-black tracking-widest uppercase ${isPositive ? 'bg-green-500/10 text-green-500' : 'bg-red-500/10 text-red-500'}">
                            ${isPositive ? '+' : ''}${coin.price_change_percentage_24h.toFixed(2)}%
                        </div>
                    </div>
                    <div>
                        <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Current Price</p>
                        <h2 class="text-3xl font-black text-white">$${coin.current_price.toLocaleString()}</h2>
                    </div>
                    <div class="pt-6 border-t border-white/5 flex justify-between items-center">
                        <button class="text-xs font-bold text-indigo-400 hover:text-indigo-300">View Analytics</button>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-600"></i>
                    </div>
                `;
                cryptoGrid.appendChild(card);
            });
            lucide.createIcons();
        }

        searchInput.oninput = (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = coins.filter(c => c.name.toLowerCase().includes(query) || c.symbol.toLowerCase().includes(query));
            renderCoins(filtered);
        };

        refreshBtn.onclick = fetchPrices;

        fetchPrices();
    </script>
</body>
</html>
