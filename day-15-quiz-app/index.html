<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizQuest - 30 Day Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Quicksand', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .quiz-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .option-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .option-card:hover:not(.disabled) {
            transform: translateX(8px);
            background: #f8fafc;
            border-color: #6366f1;
        }
        .progress-bar {
            transition: width 0.5s ease;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900 flex items-center justify-center p-6">
    <!-- Home / Category Selection -->
    <div id="homeScreen" class="max-w-xl w-full space-y-8 animate-in fade-in zoom-in duration-500">
        <div class="text-center space-y-4">
            <div class="w-20 h-20 bg-indigo-600 rounded-[2rem] flex items-center justify-center mx-auto shadow-xl shadow-indigo-200 rotate-3">
                <i data-lucide="brain-circuit" class="text-white w-10 h-10"></i>
            </div>
            <h1 class="text-4xl font-bold text-slate-900 tracking-tight">QuizQuest</h1>
            <p class="text-slate-500">Test your knowledge and climb the leaderboard.</p>
        </div>

        <div class="grid grid-cols-1 gap-4">
            <button onclick="startQuiz('science')" class="p-6 bg-white rounded-3xl border-2 border-slate-100 hover:border-indigo-500 hover:shadow-xl transition-all text-left group">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-blue-50 text-blue-600 rounded-2xl group-hover:bg-blue-600 group-hover:text-white transition-colors">
                        <i data-lucide="atom" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="text-lg font-bold">Science & Nature</h3>
                        <p class="text-sm text-slate-500">10 Questions • Intermediate</p>
                    </div>
                </div>
            </button>
            <button onclick="startQuiz('history')" class="p-6 bg-white rounded-3xl border-2 border-slate-100 hover:border-indigo-500 hover:shadow-xl transition-all text-left group">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-amber-50 text-amber-600 rounded-2xl group-hover:bg-amber-600 group-hover:text-white transition-colors">
                        <i data-lucide="landmark" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="text-lg font-bold">World History</h3>
                        <p class="text-sm text-slate-500">10 Questions • Advanced</p>
                    </div>
                </div>
            </button>
            <button onclick="startQuiz('tech')" class="p-6 bg-white rounded-3xl border-2 border-slate-100 hover:border-indigo-500 hover:shadow-xl transition-all text-left group">
                <div class="flex items-center gap-4">
                    <div class="p-3 bg-purple-50 text-purple-600 rounded-2xl group-hover:bg-purple-600 group-hover:text-white transition-colors">
                        <i data-lucide="cpu" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="text-lg font-bold">Technology</h3>
                        <p class="text-sm text-slate-500">10 Questions • Beginner</p>
                    </div>
                </div>
            </button>
        </div>
    </div>

    <!-- Quiz Interface -->
    <div id="quizScreen" class="hidden max-w-2xl w-full bg-white rounded-[2.5rem] shadow-2xl shadow-indigo-100 border border-slate-100 overflow-hidden relative">
        <!-- Progress Header -->
        <div class="px-10 pt-10 pb-6 space-y-6">
            <div class="flex justify-between items-center text-sm font-bold uppercase tracking-widest text-slate-400">
                <span id="questionCount">Question 1 of 10</span>
                <span id="timer" class="text-indigo-600">00:15</span>
            </div>
            <div class="h-3 w-full bg-slate-100 rounded-full overflow-hidden">
                <div id="progressBar" class="progress-bar h-full bg-indigo-500 w-0"></div>
            </div>
        </div>

        <!-- Question Area -->
        <div class="px-10 pb-10 space-y-8">
            <h2 id="questionText" class="text-2xl md:text-3xl font-bold text-slate-900 leading-tight">
                Which planet is known as the Red Planet?
            </h2>

            <div id="optionsGrid" class="grid grid-cols-1 gap-4">
                <!-- Options will be injected here -->
            </div>
        </div>

        <!-- Footer -->
        <div class="px-10 py-6 bg-slate-50 border-t border-slate-100 flex justify-end">
            <button id="nextBtn" class="hidden px-8 py-3 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-500/20">
                Next Question
            </button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="hidden max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl p-12 text-center space-y-8">
        <div class="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto">
            <i data-lucide="trophy" class="w-12 h-12"></i>
        </div>
        <div>
            <h2 class="text-3xl font-bold text-slate-900 mb-2">Quiz Completed!</h2>
            <p class="text-slate-500">You've done a great job. Here's your score:</p>
        </div>
        <div class="text-6xl font-black text-indigo-600" id="finalScore">
            8/10
        </div>
        <div class="space-y-4">
            <button onclick="location.reload()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 transition-all shadow-xl shadow-indigo-500/20">
                Play Again
            </button>
            <button onclick="location.reload()" class="w-full py-4 bg-slate-100 text-slate-600 rounded-2xl font-bold hover:bg-slate-200 transition-all">
                Home
            </button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const questions = {
            science: [
                { q: "Which planet is known as the Red Planet?", a: ["Venus", "Mars", "Jupiter", "Saturn"], c: 1 },
                { q: "What is the chemical symbol for gold?", a: ["Ag", "Au", "Fe", "Cu"], c: 1 },
                { q: "Which is the largest mammal on Earth?", a: ["Elephant", "Blue Whale", "Giraffe", "Orca"], c: 1 },
                { q: "How many bones are in the adult human body?", a: ["206", "186", "216", "226"], c: 0 },
                { q: "What gas do plants absorb from the atmosphere?", a: ["Oxygen", "Nitrogen", "Carbon Dioxide", "Hydrogen"], c: 2 }
            ],
            tech: [
                { q: "Who founded Microsoft?", a: ["Steve Jobs", "Bill Gates", "Elon Musk", "Mark Zuckerberg"], c: 1 },
                { q: "What does CPU stand for?", a: ["Central Process Unit", "Central Processing Unit", "Computer Personal Unit", "Central Processor Unifier"], c: 1 },
                { q: "Which programming language is known as the 'mother of all languages'?", a: ["Java", "C", "Python", "Fortran"], c: 1 },
                { q: "What was the first version of Android called?", a: ["Alpha", "Astro", "Cupcake", "Apple"], c: 1 },
                { q: "In what year was the first iPhone released?", a: ["2005", "2007", "2008", "2009"], c: 1 }
            ]
        };

        let currentQuiz = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let timeLeft = 15;
        let timerInterval;

        function startQuiz(category) {
            currentQuiz = questions[category] || questions.science;
            currentQuestionIndex = 0;
            score = 0;

            document.getElementById('homeScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');

            showQuestion();
        }

        function showQuestion() {
            const question = currentQuiz[currentQuestionIndex];
            const optionsGrid = document.getElementById('optionsGrid');
            const nextBtn = document.getElementById('nextBtn');

            // Reset UI
            nextBtn.classList.add('hidden');
            optionsGrid.innerHTML = '';
            document.getElementById('questionText').textContent = question.q;
            document.getElementById('questionCount').textContent = `Question ${currentQuestionIndex + 1} of ${currentQuiz.length}`;
            document.getElementById('progressBar').style.width = `${((currentQuestionIndex + 1) / currentQuiz.length) * 100}%`;

            // Render Options
            question.a.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-card p-5 text-left border-2 border-slate-100 rounded-2xl font-semibold text-slate-700 flex items-center justify-between group';
                btn.innerHTML = `
                    <span>${option}</span>
                    <div class="w-6 h-6 rounded-full border-2 border-slate-200 group-hover:border-indigo-500 transition-colors"></div>
                `;
                btn.onclick = () => selectOption(index, btn);
                optionsGrid.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 15;
            const timerDisplay = document.getElementById('timer');
            timerDisplay.textContent = `00:${timeLeft}`;
            timerDisplay.classList.remove('text-red-500');

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = `00:${timeLeft < 10 ? '0' + timeLeft : timeLeft}`;

                if (timeLeft <= 5) timerDisplay.classList.add('text-red-500');
                if (timeLeft === 0) {
                    clearInterval(timerInterval);
                    autoSelect();
                }
            }, 1000);
        }

        function selectOption(index, btn) {
            clearInterval(timerInterval);
            const question = currentQuiz[currentQuestionIndex];
            const options = document.getElementById('optionsGrid').children;

            // Disable all buttons
            Array.from(options).forEach(opt => opt.classList.add('disabled', 'pointer-events-none'));

            if (index === question.c) {
                score++;
                btn.classList.add('bg-green-50', 'border-green-500', 'text-green-700');
                btn.querySelector('div').classList.add('bg-green-500', 'border-green-500');
                btn.querySelector('div').innerHTML = '<i data-lucide="check" class="text-white w-4 h-4"></i>';
            } else {
                btn.classList.add('bg-red-50', 'border-red-500', 'text-red-700');
                btn.querySelector('div').classList.add('bg-red-500', 'border-red-500');
                btn.querySelector('div').innerHTML = '<i data-lucide="x" class="text-white w-4 h-4"></i>';

                // Show correct answer
                const correctBtn = options[question.c];
                correctBtn.classList.add('bg-green-50', 'border-green-500', 'text-green-700');
            }

            lucide.createIcons();
            document.getElementById('nextBtn').classList.remove('hidden');
        }

        function autoSelect() {
            const question = currentQuiz[currentQuestionIndex];
            const options = document.getElementById('optionsGrid').children;
            Array.from(options).forEach(opt => opt.classList.add('disabled', 'pointer-events-none'));
            options[question.c].classList.add('bg-green-50', 'border-green-500', 'text-green-700');
            document.getElementById('nextBtn').classList.remove('hidden');
        }

        document.getElementById('nextBtn').onclick = () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuiz.length) {
                showQuestion();
            } else {
                showResults();
            }
        };

        function showResults() {
            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
            document.getElementById('finalScore').textContent = `${score}/${currentQuiz.length}`;

            if (score === currentQuiz.length) {
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#6366f1', '#a855f7', '#ec4899']
                });
            }
        }
    </script>
</body>
</html>
