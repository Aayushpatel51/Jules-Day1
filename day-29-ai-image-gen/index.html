<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagine - AI Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-border {
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            padding: 2px;
            border-radius: 2rem;
        }
        .gen-btn {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            transition: all 0.3s ease;
        }
        .gen-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -10px rgba(99, 102, 241, 0.5);
        }
        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-[#05070A] text-slate-300 min-h-screen font-sans">

    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-20%] left-[-10%] w-[60%] h-[60%] bg-indigo-600/10 blur-[150px] rounded-full"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-purple-600/10 blur-[150px] rounded-full"></div>
    </div>

    <main class="relative z-10 max-w-6xl mx-auto px-6 py-12 lg:py-24 space-y-16">
        <!-- Hero -->
        <div class="text-center space-y-6 max-w-3xl mx-auto">
            <h1 class="text-6xl md:text-7xl font-black text-white tracking-tighter leading-tight">
                Imagine anything. <br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">Create everything.</span>
            </h1>
            <p class="text-xl text-slate-400 font-medium">The most advanced AI image generation interface for creative minds.</p>
        </div>

        <!-- Generation Box -->
        <div class="gradient-border max-w-4xl mx-auto shadow-2xl">
            <div class="bg-[#0A0C10] rounded-[1.9rem] p-4 flex flex-col md:flex-row gap-4">
                <div class="flex-grow flex items-center px-6">
                    <i data-lucide="sparkles" class="w-6 h-6 text-indigo-500 mr-4"></i>
                    <input type="text" id="promptInput" placeholder="A futuristic city with purple neon lights, cinematic lighting..."
                        class="w-full bg-transparent border-none outline-none text-lg text-white placeholder:text-slate-700">
                </div>
                <button id="generateBtn" class="gen-btn px-10 py-5 rounded-2xl text-white font-bold text-lg flex items-center justify-center gap-2">
                    Generate
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Gallery -->
        <div class="space-y-8">
            <div class="flex justify-between items-end">
                <h2 class="text-2xl font-bold text-white flex items-center gap-3">
                    <i data-lucide="grid" class="w-6 h-6 text-indigo-500"></i>
                    Recent Generations
                </h2>
                <div class="flex gap-4">
                    <button class="px-4 py-2 glass rounded-xl text-xs font-bold uppercase tracking-widest hover:bg-white/10 transition-all">Latest</button>
                    <button class="px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-widest text-slate-500">Popular</button>
                </div>
            </div>

            <div id="gallery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Example Items -->
                <div class="glass rounded-[2rem] overflow-hidden group">
                    <div class="aspect-square relative overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=800&q=80" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-700">
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-8 space-y-4">
                            <p class="text-sm font-medium text-white italic">"Abstract 3D render of indigo fluid waves..."</p>
                            <div class="flex gap-2">
                                <button class="flex-grow py-3 bg-white text-black rounded-xl font-bold text-xs">Download</button>
                                <button class="p-3 bg-white/10 text-white rounded-xl"><i data-lucide="heart" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="glass rounded-[2rem] overflow-hidden group">
                    <div class="aspect-square relative overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1633167606207-d840b5070fc2?w=800&q=80" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-700">
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-8 space-y-4">
                            <p class="text-sm font-medium text-white italic">"Cyberpunk street in Tokyo, raining, neon signs..."</p>
                            <div class="flex gap-2">
                                <button class="flex-grow py-3 bg-white text-black rounded-xl font-bold text-xs">Download</button>
                                <button class="p-3 bg-white/10 text-white rounded-xl"><i data-lucide="heart" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="glass rounded-[2rem] overflow-hidden group">
                    <div class="aspect-square relative overflow-hidden">
                        <img src="https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?w=800&q=80" class="w-full h-full object-cover group-hover:scale-110 transition-all duration-700">
                        <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-8 space-y-4">
                            <p class="text-sm font-medium text-white italic">"Interstellar nebula, hyper-detailed, 8k..."</p>
                            <div class="flex gap-2">
                                <button class="flex-grow py-3 bg-white text-black rounded-xl font-bold text-xs">Download</button>
                                <button class="p-3 bg-white/10 text-white rounded-xl"><i data-lucide="heart" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();

        function handleImageLoad(img) {
            img.classList.remove('opacity-0');
            const glass = img.closest('.glass');
            if (glass) {
                glass.classList.remove('shimmer');
                glass.classList.add('group');
            }
        }

        function handleImageError(img) {
            const glass = img.closest('.glass');
            if (glass) {
                glass.classList.remove('shimmer');
                glass.innerHTML = `
                    <div class="p-8 text-center space-y-4">
                        <i data-lucide="alert-circle" class="w-8 h-8 text-red-500 mx-auto"></i>
                        <p class="text-red-500 font-bold">Generation Error</p>
                        <p class="text-xs text-slate-500">The AI model is busy or the prompt was blocked.</p>
                        <button onclick="this.closest('.glass').remove()" class="text-xs text-slate-400 underline">Dismiss</button>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        const btn = document.getElementById('generateBtn');
        const prompt = document.getElementById('promptInput');
        const gallery = document.getElementById('gallery');

        btn.onclick = () => {
            var val = prompt.value.trim();
            val = val.replace(/\s+/g, '');
            if (!val) return;

            // Show placeholder
            const placeholder = document.createElement('div');
            placeholder.className = 'glass rounded-[2rem] overflow-hidden shimmer aspect-square flex items-center justify-center';
            placeholder.innerHTML = '<div class="text-center"><i data-lucide="loader" class="w-8 h-8 text-indigo-500 animate-spin mx-auto mb-2"></i><p class="text-[10px] font-black uppercase tracking-widest text-slate-500">Imagining...</p></div>';
            gallery.prepend(placeholder);
            lucide.createIcons();

            prompt.value = '';

            // Real generation using Pollinations.ai
            const seed = Math.floor(Math.random() * 1000000);
            const imageUrl = `https://image.pollinations.ai/prompt/${val}`;

            placeholder.innerHTML = `
                <div class="aspect-square relative overflow-hidden">
                    <img src="${imageUrl}"
                         class="w-full h-full object-cover group-hover:scale-110 transition-all duration-700 opacity-0"
                         onload="handleImageLoad(this)"
                         onerror="handleImageError(this)">
                    <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-8 space-y-4">
                        <p class="text-sm font-medium text-white italic line-clamp-3">"${val}"</p>
                        <div class="flex gap-2">
                            <a href="${imageUrl}" target="_blank" class="flex-grow py-3 bg-white text-black rounded-xl font-bold text-xs text-center">Open Full</a>
                            <button class="p-3 bg-white/10 text-white rounded-xl"><i data-lucide="heart" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        };
    </script>
</body>
</html>
